#
# Notification mirror: Gadgetbridge (NUS over BLE) -> ILI9341 (LVGL)
#

# --- Display (ILI9341 over SPI) ---
CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_GPIO=y

# --- nRF5340 DK / system ---
CONFIG_DK_LIBRARY=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# FPU + newlib (LVGL uses some float/formatting)
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y

# --- LVGL ---
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LABEL=y
# 内置思源黑体中文子集(含 ASCII 32~127 + 约 1187 个常用汉字),设为全局默认字体
CONFIG_LV_FONT_DEFAULT_SOURCE_HAN_SANS_SC_16_CJK=y
# 顶部头像用 LVGL 内置符号字体绘制邮件/电话/音乐等图标
CONFIG_LV_FONT_MONTSERRAT_20=y

# --- BLE / Nordic UART Service (Gadgetbridge talks NUS) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Gadgetbridge recognizes the Bangle.js device by name.
CONFIG_BT_DEVICE_NAME="Bangle.js"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_NUS=y
# Gadgetbridge (Bangle.js device type) bonds before talking NUS.
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
# Without a settings backend every bond/CCC save fails with -ENOENT and the
# phone reports the pairing as failed. NVS lives in storage_partition.
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# --- Logging (RTT so we can watch parse output on PC) ---
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n
CONFIG_ASSERT=y